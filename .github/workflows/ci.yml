name: CI

# Two jobs. `ci` is the required check: it runs the whole gate, so it covers lint, typecheck, the committed bundle,
# tests, the pack check, conformance, docs drift and the forbidden scan. `install` proves the pushed commit installs
# as a git dependency with OpenCode's own installer, in an isolated HOME.
#
# It runs locally too: npm ci --ignore-scripts && npm run check
#
# Public repository: a pull request from a fork must never reach a self-hosted runner. The runner rule below keeps
# every fork pull request on ubuntu-24.04, and lets this repository's own runs use the org's public runner when set.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: The committed bundle is the one the sources produce
        run: npm run bundle && git diff --exit-code dist/
      - run: npm test
      - run: npm run pack
      - run: npx plugin-kit check
      - run: npx plugin-kit docs --check

  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenCode 2.4.1 in an isolated HOME
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/plugin-home"
          mkdir -p "$HOME"
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.4.1 --no-modify-path
          "$HOME/.opencode/bin/opencode" --version
      - name: Install the pushed commit as an OpenCode plugin
        env:
          # The pull request's merge commit is not fetchable from a plain clone; install the pushed head instead.
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/plugin-home"
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode plugin add "github:we-the-rebel-alliance/plugin-template#${GITHUB_SHA}"
          entry="$(find "$HOME/.cache/opencode/npm" -path '*/node_modules/*/dist/index.js' -print -quit)"
          test -n "$entry" || { echo "the installed package carries no dist/index.js" >&2; exit 1; }
          echo "the installed package carries $entry"
